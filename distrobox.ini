# Declarative definition of the `supersilviabox` development container.
#
#   distrobox assemble create --file distrobox.ini              create if absent (idempotent)
#   distrobox assemble create --replace --file distrobox.ini    destroy and rebuild
#   distrobox assemble rm --file distrobox.ini                  destroy
#
# setup-supersilvia.sh calls the first form. Everything the box contains is declared
# here; nothing is installed by hand. After changing this file, rebuild with --replace
# and re-run scripts/doctor.sh.
#
# distrobox 1.8.x ini parser, the parts that bite:
#   - a value must not contain " #": everything from there is stripped as a comment
#   - repeated keys are cumulative, in file order
#   - init_hooks/pre_init_hooks lines are joined with && unless a line ends in ';'
#     (every hook line below ends in ';' so one failure cannot silently skip the rest)
#   - init_hooks run as root, after additional_packages have been installed
#   - use init_hooks, NOT pre_init_hooks. distrobox-create embeds the init hooks in the
#     generated podman command single-quoted (-- '<hooks>') but the pre-init hooks
#     double-quoted (--pre-init-hooks "<hooks>"), so a pre_init_hooks value containing a
#     quote breaks the eval, and one containing $(...) or $var is expanded on the HOST
#     before the container is created. init_hooks has neither problem.
#   - the whole block is a single eval'd shell string, so shell vars carry between lines

[supersilviabox]

# Pinned. fedora-toolbox:latest moves under you and the RPM Fusion freeworld swap in
# init_hooks is the part that breaks across releases. Bump deliberately, then rebuild
# with --replace and run scripts/doctor.sh.
image=registry.fedoraproject.org/fedora-toolbox:44

# distrobox already passes --userns keep-id:size=65536 for rootless podman; declaring it
# here makes the requirement explicit and survives a change in distrobox's defaults.
# Without it, files this container writes to the shared $HOME land under a subuid and the
# host user can no longer read them (this is what happened to ~/.vscode-server).
additional_flags=--userns keep-id:size=65536

# Run init (and therefore the hooks below) at create time rather than at first enter,
# so a broken build fails while you are still looking at the terminal.
start_now=true

# --- toolchain ------------------------------------------------------------------------
additional_packages=gcc gcc-c++ make pkgconf-pkg-config clang-devel
# --- eframe/winit native: X11 + Wayland (the host is KDE on Wayland) --------------------
additional_packages=libxkbcommon-devel libxkbcommon-x11-devel libxcb-devel wayland-devel openssl-devel
# --- the renderer: Mesa's Vulkan drivers, the DRI drivers, xvfb as a CI fallback ----------
additional_packages=mesa-dri-drivers mesa-vulkan-drivers
additional_packages=xorg-x11-server-Xvfb
# --- adapter and VA-API introspection, used by scripts/doctor.sh ------------------------
additional_packages=vulkan-tools libva-utils
# --- profiling: perf, for where a thread's time goes -------------------------------------
additional_packages=perf
# --- rfd file dialogs: the xdg-portal backend, so no GTK is linked into the binary -------
# gtk3-devel stays declared because gstreamer1-plugins-bad-free links libgtk-3 regardless,
# and the declared-packages check in scripts/doctor.sh is what notices when an --allowerasing
# swap has quietly removed it along with everything else that depends on GTK.
additional_packages=gtk3-devel
# --- cpal: the audio thread opens the device through ALSA (midir, later, wants it too) ---
additional_packages=alsa-lib-devel
# --- gilrs: gilrs-core links libudev to enumerate and watch for controllers on Linux ------
additional_packages=systemd-devel
# --- fonts inside the box so egui/text snapshots match the host -------------------------
additional_packages=fontconfig-devel freetype-devel
# --- VA-API headers; the drivers themselves come from RPM Fusion in init_hooks ----------
additional_packages=libva-devel
# --- GStreamer: headers for the Rust bindings, v4l2src (good), the VA-API decoders (bad), ---
# --- pipewiresrc, and gst-inspect for scripts/doctor.sh ----------------------------------
additional_packages=gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-good
additional_packages=gstreamer1-plugins-bad-free pipewire-gstreamer

# --- hardware video decode ----------------------------------------------------------------
# The VA-API driver is per vendor and every one of them lives in RPM Fusion, which is why
# they are installed here rather than in additional_packages: additional_packages run
# BEFORE init_hooks, and RPM Fusion is not enabled until the hook below adds it.
#   AMD/generic Mesa -> mesa-va-drivers-freeworld     Intel Gen8+ -> intel-media-driver (iHD)
#   pre-Gen8 Intel   -> libva-intel-driver (i965)     NVIDIA      -> libva-nvidia-driver (bridge)
# Installing all of them on every box is deliberate: each is inert on hardware it does not
# drive, libva picks by PCI ID at run time, and it keeps one distrobox.ini working on all
# three vendors. Only the Intel iHD line is a hard failure; the other two are optional.
# Fedora strips H.264/H.265/VC-1 from mesa-va-drivers and splits ffmpeg into
# libav*-free/libsw*-free. RPM Fusion's builds restore both. --allowerasing appears on
# exactly one of these lines, and the difference matters:
#
#   mesa-va-drivers-freeworld carries "Provides: mesa-va-drivers = <exact version>", so the
#   solver can substitute it. Adding --allowerasing there does not help it substitute; it
#   only grants permission to solve by deletion instead, and it takes that option: in
#   testing it erased 280 packages -- gtk3-devel, libva-utils and Xvfb among them -- and
#   the box looked fine until something needed one of them. A stock
#   fedora-toolbox image has no mesa-va-drivers installed at all, so this is normally a
#   plain install; the swap form is kept for hosts that do have it.
#
#   RPM Fusion's ffmpeg-libs both Provides and Conflicts with Fedora's libavcodec-free,
#   libswresample-free and libavutil-free. Nothing can substitute for those, so that swap
#   genuinely cannot resolve without --allowerasing -- but because ffmpeg-libs provides
#   what the dependents need, the erasure is limited to the -free packages themselves.
#
# The release-rpm URL is version-numbered: try the running Fedora first, then fall back one
# release for the window where a new Fedora has shipped and RPM Fusion has not. Each line
# reports its own failure rather than aborting the rest; scripts/doctor.sh is what turns a
# broken box into a hard failure, and its "declared packages" check re-verifies this whole
# list against distrobox.ini afterwards.
init_hooks=printf "supersilviabox: init hooks starting\n";
init_hooks=fedora_ver=$(rpm -E %fedora);
init_hooks=for v in "$fedora_ver" "$(( fedora_ver - 1 ))"; do rpm -q rpmfusion-free-release >/dev/null 2>&1 && break; dnf install -y "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$v.noarch.rpm" "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$v.noarch.rpm" && break; done;
init_hooks=rpm -q rpmfusion-free-release >/dev/null 2>&1 || printf "supersilviabox: INIT HOOK FAILED: RPM Fusion repos absent, VA-API will lack H264/HEVC\n" >&2;
init_hooks=if rpm -q mesa-va-drivers >/dev/null 2>&1; then dnf swap -y mesa-va-drivers mesa-va-drivers-freeworld || printf "supersilviabox: INIT HOOK FAILED: mesa-va-drivers-freeworld swap\n" >&2; else dnf install -y mesa-va-drivers-freeworld || printf "supersilviabox: INIT HOOK FAILED: mesa-va-drivers-freeworld install\n" >&2; fi;
init_hooks=dnf install -y mesa-vdpau-drivers-freeworld >/dev/null 2>&1 || printf "supersilviabox: init: no mesa-vdpau-drivers-freeworld for this release, skipping. VDPAU is legacy; supersilviabox uses VA-API\n";
init_hooks=dnf install -y intel-media-driver || printf "supersilviabox: INIT HOOK FAILED: intel-media-driver (Intel Gen8+ iHD VA-API driver)\n" >&2;
init_hooks=dnf install -y libva-intel-driver || printf "supersilviabox: init: no libva-intel-driver (pre-Gen8 i965 fallback), skipping\n";
init_hooks=dnf install -y libva-nvidia-driver || printf "supersilviabox: init: no libva-nvidia-driver, skipping. NVIDIA decodes through NVDEC without it\n";
init_hooks=dnf swap -y libavcodec-free ffmpeg-libs --allowerasing || dnf swap -y ffmpeg-free ffmpeg --allowerasing || printf "supersilviabox: INIT HOOK FAILED: full ffmpeg swap\n" >&2;
init_hooks=dnf install -y ffmpeg ffmpeg-devel || printf "supersilviabox: INIT HOOK FAILED: ffmpeg ffmpeg-devel\n" >&2;
# --- the host's system D-Bus --------------------------------------------------------------
# distrobox shares the host's session bus but not its system bus, which it mounts only under
# /run/host. The NDI runtime finds streams through the host's Avahi on the system bus, so
# without this link tests/ndi.rs cannot see its own sender and check.sh fails.
init_hooks=mkdir -p /run/dbus && ln -sf /run/host/run/dbus/system_bus_socket /run/dbus/system_bus_socket || printf "supersilviabox: INIT HOOK FAILED: system D-Bus link\n" >&2;
init_hooks=printf "supersilviabox: init hooks done\n";
