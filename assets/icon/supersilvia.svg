<!-- The supersilvia logo: the mark in white with a black outline 6 units wide, on nothing.
     The outline is the mark's own edge moved outward with sharp corners, not a stroke —
     a stroke rounds the tips — so it is a flattened polygon, drawn first, under the mark.
     The field is a square around the outline, so nobody has to letterbox the icon.
     Everything else under `assets/icon/` is rendered from this file and
     `supersilvia-mark.svg` by `scripts/make-icons.py`. Edit these two, re-run that. -->
