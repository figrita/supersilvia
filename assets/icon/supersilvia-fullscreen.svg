<?xml version="1.0" encoding="utf-8"?>
<!-- The icon a fullscreen picture window carries: the fullscreen mark, white on black. The
     geometry is `expand_mark` in `src/ui/node_widget.rs` — four brackets, each arm 0.32 of
     the box — placed in the same 18..82 square as the pop-out icon beside it, so the two
     read as one pair in a task switcher. Rendered by `scripts/make-icons.py`. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100px" height="100px">
  <rect x="0" y="0" width="100" height="100" fill="black"/>
  <path fill="none" stroke="white" stroke-width="7.68" d="
    M 38.48 18 L 18 18 L 18 38.48
    M 61.52 18 L 82 18 L 82 38.48
    M 38.48 82 L 18 82 L 18 61.52
    M 61.52 82 L 82 82 L 82 61.52"/>
</svg>
